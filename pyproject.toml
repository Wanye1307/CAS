[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cas-uq-research"
version = "0.1.0"
description = "CAS-UQ and greedy-label HAC benchmark code for medical VQA"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "medical-vqa", "calibration", "hallucination",
    "vision-language-models", "vlm", "confidence-estimation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "torch>=2.4,<2.12",
    "transformers>=4.45.0",
    "datasets>=2.19.0",
    "accelerate>=0.27.0",
    "peft>=0.10.0",
    "bitsandbytes>=0.43.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
hedge = [
    "hedge-bench",
    "sentence-transformers>=2.0.0",
]
internvl = [
    "timm>=0.9.0",
]
dev = [
    "pytest>=7.0",
    "pandas>=1.3.0",
    "pyarrow>=12.0.0",
]
docs = [
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.0",
]
all = [
    "cas-uq-research[hedge,internvl,dev]",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["medvlm*"]
